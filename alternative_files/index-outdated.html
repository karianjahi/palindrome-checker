<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>

        <div class="text">
            <p id="first-line">Palindrome checker</p>
            <p id="second-line">Is it a Palindrome?</p>
        </div>

        <div class="visible-area">
            <div class="text">
                <p>Enter in text to check for a palindrome:</p>
            </div>
            <div class="text-area">
                <textarea id="possible-palindrome"
                 value="possible-palindrome" cols="50" rows="4"></textarea>
                 <button id="check-button">Check</button>
            </div>
        
            <div id="output-box">
                <p id="check-palindrome">Good</p>
            </div>
        </div>
    
        <div id="explanation">
            💡 A palindrome is a word or sentence that's spelled the same way both forward and backward, ignoring punctuation, case, and spacing.
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
